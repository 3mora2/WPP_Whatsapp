[project]
name = "WPP_Whatsapp"
version = "2.3.1"
description = "WPP_Whatsapp aim of exporting functions from WhatsApp Web to the python"
requires-python = ">=3.9"
authors = [
    {name = "Ammar Alkotb", email = "ammar.alkotb@gmail.com"}
]
license = "MIT"
license-files = ["LICENSE"]

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp>=3.10.11",
    "node-semver>=0.9.0",
    "pillow>=10.4.0",
    "playwright>=1.48.0",
    "psutil>=7.2.2",
    "pyee>=12.0.0",
    "requests>=2.32.4",
    "segno>=1.6.6",
    "typing-extensions>=4.13.2",
]

[project.optional-dependencies]
stealth = ["playwright-stealth>=2.0.0"]
mcp = ["fastmcp>=4.1,<5; python_version >= '3.10'"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff==0.11.10",
    "mypy>=1.14,<2",
]

[project.scripts]
wpp-whatsapp-mcp = "WPP_Whatsapp.mcp.cli:main"

[project.urls]
Homepage = "https://github.com/3mora2/WPP_Whatsapp"
"Bug Report" = "https://github.com/3mora2/WPP_Whatsapp/issues/new"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools.packages.find]
where = ["."]
include = ["WPP_Whatsapp*"]
exclude = ["archive*", "tests*", "examples*"]

[tool.setuptools.package-data]
WPP_Whatsapp = ["*/*.js", "*.md", "js_lib/*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.9"
files = ["WPP_Whatsapp/core/requests.py", "WPP_Whatsapp/core/delivery_models.py", "WPP_Whatsapp/core/contracts.py", "WPP_Whatsapp/core/acknowledgements.py", "WPP_Whatsapp/core/event_store.py", "WPP_Whatsapp/core/work.py", "WPP_Whatsapp/core/subscriptions.py", "WPP_Whatsapp/core/recovery.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pydantic.*", "fastmcp.*", "mcp.*"]
follow_imports = "skip"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
