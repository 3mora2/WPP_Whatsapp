name: Installed package compatibility
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.9', dependencies: minimum, mcp: false}
          - {os: ubuntu-latest, python: '3.12', dependencies: minimum, mcp: true}
          - {os: ubuntu-latest, python: '3.13', dependencies: latest, mcp: true}
          - {os: ubuntu-latest, python: '3.14', dependencies: latest, mcp: true}
          - {os: windows-latest, python: '3.12', dependencies: latest, mcp: true}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build once and test only the installed wheel
        shell: bash
        run: |
          uv build --wheel --out-dir dist
          uv venv "$RUNNER_TEMP/wheel-env" --python '${{ matrix.python }}'
          PY="$RUNNER_TEMP/wheel-env/bin/python"
          if [ '${{ runner.os }}' = 'Windows' ]; then PY="$RUNNER_TEMP/wheel-env/Scripts/python.exe"; fi
          EXTRA=""; CHECK=""
          if [ '${{ matrix.mcp }}' = 'true' ]; then EXTRA='[mcp]'; CHECK='--mcp'; fi
          CONSTRAINTS=""
          if [ '${{ matrix.dependencies }}' = 'minimum' ]; then CONSTRAINTS='--constraint tools/constraints-minimum.txt'; fi
          if [ '${{ matrix.dependencies }}' = 'minimum' ] && [ '${{ matrix.mcp }}' = 'true' ]; then CONSTRAINTS='--constraint tools/constraints-minimum-mcp.txt'; fi
          uv pip install --python "$PY" $CONSTRAINTS "$(echo dist/*.whl)$EXTRA"
          VERSION=$("$PY" -I -c 'from importlib.metadata import version; print(version("WPP_Whatsapp"))')
          "$PY" -I tools/verify_installed.py --version "$VERSION" $CHECK
