name: Test, Build & Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published release tag to recover (for example v1.2.0)'
        required: true
        type: string
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# Serialize publication of a tag; a recovery never interrupts an active upload.
concurrency:
  group: package-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.plan.outputs.ref }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate release and pin the exact source commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/verify_release.py plan

  test:
    needs: release-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-check.outputs.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov=WPP_Whatsapp --cov-report=xml --cov-report=term-missing
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  lint:
    needs: release-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-check.outputs.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - name: Check syntax and undefined names
        run: |
          uvx flake8 WPP_Whatsapp tests --count --select=E9,F63,F7,F82 --show-source --statistics
          if [ -d tools ]; then uvx flake8 tools --count --select=E9,F63,F7,F82 --show-source --statistics; fi
      - name: Check core code quality and formatting
        run: |
          if [ -d WPP_Whatsapp/core ]; then
            uvx ruff@0.11.10 check WPP_Whatsapp/core
            uvx ruff@0.11.10 format --check WPP_Whatsapp/core
          fi
          if [ -d WPP_Whatsapp/mcp ]; then
            uvx ruff@0.11.10 check WPP_Whatsapp/mcp
            uvx ruff@0.11.10 format --check WPP_Whatsapp/mcp
          fi
      - name: Validate documentation and example API contracts
        run: |
          if [ -f tools/verify_docs.py ]; then
            uvx ruff@0.11.10 check tools/verify_docs.py
            uvx ruff@0.11.10 format --check tools/verify_docs.py
            uv run python tools/verify_docs.py
          fi

  mcp-test:
    needs: release-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-check.outputs.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test optional FastMCP tools and real transports
        # Older published tags can still be recovered with the current workflow.
        run: |
          if [ -f tests/test_mcp.py ]; then
            uv sync --extra dev --extra mcp
            uv run pytest tests/test_mcp.py tests/test_mcp_optional.py -v --tb=short
          fi

  build:
    needs: [release-check, test, lint, mcp-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-check.outputs.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - name: Load validator from the workflow commit (also supports older release tags)
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: git show "$WORKFLOW_SHA:tools/verify_release.py" > "$RUNNER_TEMP/verify_release.py"
      - name: Build and validate wheel and source distribution
        run: |
          uv build
          uv run --no-project python "$RUNNER_TEMP/verify_release.py" dist
          uvx --from twine twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  deploy:
    needs: [release-check, test, lint, build]
    if: needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-check.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Validate downloaded artifacts against the selected source
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git show "$WORKFLOW_SHA:tools/verify_release.py" > "$RUNNER_TEMP/verify_release.py"
          python "$RUNNER_TEMP/verify_release.py" dist
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
      - name: Verify published version and payloads on PyPI
        run: python "$RUNNER_TEMP/verify_release.py" pypi
